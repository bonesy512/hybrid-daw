[package]
name = "hybrid-daw"
version = "0.1.0"
description = "HybridDAW - a hybrid digital audio workstation"
authors = ["bonesy512"]
license = ""
repository = "https://github.com/bonesy512/hybrid-daw"
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "hybrid_daw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2" }

[dependencies]
cpal = "0.15"
rtrb = "0.3"
midir = "0.9"
midly = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hound = "3.5"
symphonia = { version = "0.5", features = ["all"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
log = "0.4"
tauri = { version = "2.12.3" }
tauri-plugin-log = "2"
