[package]
name = "hybrid-daw"
version = "0.1.0"
description = "HybridDAW - a hybrid digital audio workstation"
authors = ["bonesy512"]
license = ""
repository = "https://github.com/bonesy512/hybrid-daw"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "hybrid_daw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3" }
tauri-plugin-log = "2"
